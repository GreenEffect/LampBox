services:
  webserver:
    build:
      context: ./bin/${PHPVERSION}
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    # One image per PHP version: switching PHPVERSION never reuses another one
    image: "${COMPOSE_PROJECT_NAME}-webserver:${PHPVERSION}"
    # User mapping: Only applied on Linux/Mac, ignored on Windows
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    container_name: "${COMPOSE_PROJECT_NAME}-webserver"
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ${DOCUMENT_ROOT:-./www}:/var/www/html:rw
      - ${PHP_INI:-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${SSL_DIR:-./config/ssl}:/etc/apache2/ssl/
      - ${VHOSTS_DIR:-./config/vhosts}:/etc/apache2/sites-enabled
      - ${APACHE_LOG_DIR:-./logs/apache2}:/var/log/apache2
      - ${PHPMYADMIN_CONFIG:-./config/phpmyadmin/config.inc.php}:/opt/phpmyadmin/config.inc.php
    environment:
      LAMPBOX_ENV: ${LAMPBOX_ENV:-development}
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT:-/var/www/html}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: "${COMPOSE_PROJECT_NAME}-database"
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME}"
      PHPMYADMIN_BLOWFISH_SECRET: ${PHPMYADMIN_BLOWFISH_SECRET}
      # Apache 'Require' rule protecting phpMyAdmin (e.g. "all denied", "ip 203.0.113.10")
      PHPMYADMIN_REQUIRE: ${PHPMYADMIN_REQUIRE:-all granted}
      # Pass proxy configuration to Apache
      USE_REVERSE_PROXY: ${USE_REVERSE_PROXY:-false}
    networks:
      - internal
    depends_on:
      - database

  database:
    build:
      context: "./bin/${DATABASE}"
    # One image per engine: switching DATABASE never reuses another engine
    image: "${COMPOSE_PROJECT_NAME}-database:${DATABASE}"
    container_name: "${COMPOSE_PROJECT_NAME}-database"
    restart: unless-stopped
    # No host port by default, so several projects can run in parallel.
    # Set MYSQL_PORT in .env to publish one (docker-compose.mysql-port.yml
    # is then applied by lamp.sh). Containers always reach the database at
    # ${COMPOSE_PROJECT_NAME}-database:3306.
    volumes:
      - ${MYSQL_INITDB_DIR:-./config/initdb}:/docker-entrypoint-initdb.d
      - ${MYSQL_DATA_DIR:-./data/mysql-${DATABASE}}:/var/lib/mysql
      - ${MYSQL_LOG_DIR:-./logs/mysql-${DATABASE}}:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - internal

# ==============================================================================
# Reverse proxy note
# ==============================================================================
# In reverse proxy mode, routing is handled by the SHARED Traefik stack
# (see traefik/docker-compose.yml). Each project attaches its webserver to the
# external 'lampbox_web' network and declares Traefik labels via the
# docker-compose.proxy.yml override. There is no per-project proxy container,
# so multiple projects can run in parallel without port 80/443 conflicts.

networks:
  internal:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME}-network
