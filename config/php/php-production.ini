; LampBox - PHP settings for production (LAMPBOX_ENV=production)
; Replaces config/php/php.ini through docker-compose.production.yml.

memory_limit = 256M
post_max_size = 100M
upload_max_filesize = 100M

; Errors go to the Apache error log, never to visitors
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Do not advertise the PHP version (X-Powered-By header)
expose_php = Off

; Xdebug is installed in every image: keep it off in production
xdebug.mode = "off"

; Session upload progress is enabled by default and reachable without
; session_start(); keep it off unless the application needs it
; (recommended by GHSA-6wmf-4rv5-p3rp / CVE-2026-109619, even when patched)
session.upload_progress.enabled = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
