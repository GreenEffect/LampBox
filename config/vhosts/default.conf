# Apache VirtualHost Configuration for LampBox
# This configuration works in both direct access and reverse proxy modes

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    ServerName localhost

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Handle X-Forwarded-* headers when behind reverse proxy
    SetEnvIf X-Forwarded-Proto https HTTPS=on
    SetEnvIf X-Forwarded-Proto https REQUEST_SCHEME=https
    SetEnvIf X-Forwarded-Host ^(.+)$ HTTP_HOST=$1

    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# HTTPS VirtualHost (direct access mode, HTTPS_PORT)
# Enabled automatically once a certificate exists in config/ssl:
#   ./generate-ssl-certs.sh localhost
# then restart the webserver. Behind the shared Traefik proxy, HTTPS is
# handled by Traefik and this port is not published.
<IfFile /etc/apache2/ssl/cert.pem>
<IfFile /etc/apache2/ssl/cert-key.pem>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    ServerName localhost

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/cert.pem
    SSLCertificateKeyFile /etc/apache2/ssl/cert-key.pem

    # Modern SSL configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

    # Error and access logs
    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
</IfFile>
</IfFile>
